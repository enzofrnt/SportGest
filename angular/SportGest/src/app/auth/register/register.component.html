<div class="register-container">
  <div class="register-card">
    <h2>Inscription</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()"
      class="register-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
        <div class="invalid-feedback"
          *ngIf="registerForm.get('email')?.errors?.['required']">
          L'email est requis
        </div>
        <div class="invalid-feedback"
          *ngIf="registerForm.get('email')?.errors?.['email']">
          Format d'email invalide
        </div>
      </div>

      <div class="form-group">
        <label for="prenom">Prénom</label>
        <input
          type="text"
          id="prenom"
          formControlName="prenom"
          class="form-control"
          [class.is-invalid]="registerForm.get('prenom')?.invalid && registerForm.get('prenom')?.touched">
        <div class="invalid-feedback"
          *ngIf="registerForm.get('prenom')?.errors?.['required']">
          Le prénom est requis
        </div>
      </div>

      <div class="form-group">
        <label for="nom">Nom</label>
        <input
          type="text"
          id="nom"
          formControlName="nom"
          class="form-control"
          [class.is-invalid]="registerForm.get('nom')?.invalid && registerForm.get('nom')?.touched">
        <div class="invalid-feedback"
          *ngIf="registerForm.get('nom')?.errors?.['required']">
          Le nom est requis
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          [class.is-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
        <div class="invalid-feedback"
          *ngIf="registerForm.get('password')?.errors?.['required']">
          Le mot de passe est requis
        </div>
        <div class="invalid-feedback"
          *ngIf="registerForm.get('password')?.errors?.['minlength']">
          Le mot de passe doit contenir au moins 6 caractères
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="registerForm.invalid || isLoading">
        {{ isLoading ? 'Inscription en cours...' : 'S\'inscrire' }}
      </button>
    </form>

    <div class="login-link">
      Déjà inscrit ? <a routerLink="/connexion">Connectez-vous</a>
    </div>
  </div>
</div>
